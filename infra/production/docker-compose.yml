# workspace on one server. Guide: infra/production/README.md. Settings: infra/production/.env (install.sh writes it).
#
#   ./install.sh                           # asks for the domains, writes .env with generated secrets, starts it
#   docker compose up -d                   # also works without .env: http://localhost, secrets generated by `init`
#   COMPOSE_PROFILES=s3,meet               # in .env: bundled S3, LiveKit video meetings
#
#  Default set: postgres, app, caddy; files on local disk (ADR 0021).
#  browser ─► caddy (443, automatic HTTPS) ─┬─► app:3000  web app ──► app:4000 (gateway, in the same container)
#                                           ├─► app:4000  /socket.io/, /storage/, /api/mcp (+ OAuth), /api/docs
#                                           └─► s3:8333   FILES_DOMAIN, presigned up/downloads (--profile s3)
#  app = one container: the web app and the server, every module (gateway, identity, platform, search, chat, home,
#  work, employee, ai) in one process; modules call each other in memory and hand events over in process.
#  server ─► postgres (one database, a schema and a role per module; --profile pgbouncer optional)
#  events: outbox (Postgres) ─► relay (in each module) ─► the consuming modules' handlers, same process
#
# Only caddy (or, without it, the ports bound to BIND_ADDRESS) is reachable from outside.
name: workspace-prod

x-app: &app
  image: ${WORKSPACE_IMAGE:-workspace:local}
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
    args:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  restart: unless-stopped

# Secrets left empty in .env are read from the file the `init` job generated (entrypoint.sh, load-secrets.sh).
x-secrets: &secrets-volume secrets:/run/workspace:ro

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_TOKEN_SECRET: ${INTERNAL_TOKEN_SECRET:-}
  APP_URL: ${APP_URL:-http://localhost}
  WEB_ORIGIN: ${APP_URL:-http://localhost}
  # Days events stay in each module's outbox, the copy they are replayed from.
  EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-3}
  # Encrypts sign-in secrets at rest (signing keys, TOTP seeds, company IdP client secrets).
  AUTH_SECRET: ${AUTH_SECRET:-}
  # Files: on local disk (the `data` volume, served by the server at APP_URL/storage/) unless S3_ENDPOINT is set
  # (bundled SeaweedFS with --profile s3, or your own S3/R2). STORAGE_DRIVER=local|s3 forces one.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-}
  STORAGE_LOCAL_DIR: /data/files
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-workspace-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Optional: without SMTP_URL no email is sent; invitations and password resets are handed over as links instead.
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  TRUST_PROXY: loopback, uniquelocal
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

services:
  # ── Secrets ─────────────────────────────────────────────────────────────────────────────────────
  # One-shot: generates every secret .env leaves empty, once, into the `secrets` volume (kept across upgrades;
  # backup.sh saves it with the database). install.sh writes them into .env instead.
  init:
    <<: *app
    command: ["init-secrets"]
    restart: "no"
    # Root: the volume may have been created by another container first (owned by root); files stay readable (644).
    user: "0:0"
    volumes:
      - secrets:/run/workspace

  # ── Infrastructure ──────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    entrypoint: ["sh", "-c", '. /usr/local/bin/wx-load-secrets.sh && exec docker-entrypoint.sh "$$@"', "--"]
    # The server connects directly with a small pool per module (see docs/runbooks/operations.md "Connections").
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:-}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./load-secrets.sh:/usr/local/bin/wx-load-secrets.sh:ro
      - *secrets-volume
      - pgdata:/var/lib/postgresql/data
    # Over TCP: the socket already answers while the first start runs the init scripts on a temporary server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional (`--profile pgbouncer`): a transaction pooler, for a database shared with other tools or a managed
  # Postgres with few connections. With it, set PG_HOST=pgbouncer and PG_PORT=6432 in .env; migrations, LISTEN and
  # job locks keep their direct owner connection.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    profiles: ["pgbouncer"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-}
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:-}
    # The auth file is written from the environment on every start (no passwords on disk in the repo).
    entrypoint:
      - sh
      - -c
      - |
        . /usr/local/bin/wx-load-secrets.sh
        printf '"workspace_owner" "%s"\n' "$$PG_OWNER_PASSWORD" > /etc/pgbouncer/userlist.txt
        for m in identity platform chat work home employee ai search web; do
          printf '"workspace_%s" "%s"\n' "$$m" "$$PG_APP_PASSWORD" >> /etc/pgbouncer/userlist.txt
        done
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./load-secrets.sh:/usr/local/bin/wx-load-secrets.sh:ro
      - *secrets-volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional (`--profile s3`): S3-compatible object storage (files, meeting recordings) on FILES_DOMAIN, with
  # S3_ENDPOINT=https://<FILES_DOMAIN>. Without it files live on local disk (the `data` volume); LiveKit meeting
  # recordings need S3 (this, or your own S3/R2: set S3_* in .env and leave the profile off).
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    profiles: ["s3"]
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint:
      - sh
      - -c
      - |
        . /usr/local/bin/wx-load-secrets.sh
        printf '{"identities":[{"name":"workspace","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec /usr/bin/weed -logtostderr=true server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - ./load-secrets.sh:/usr/local/bin/wx-load-secrets.sh:ro
      - *secrets-volume
      - s3data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8333:8333"

  # ── The app ─────────────────────────────────────────────────────────────────────────────────────
  # One container: migrations, then the server (:4000) and the web app (:3000) side by side (entrypoint.sh `app`).
  # One Postgres role per module (its schema only); OWNER_DATABASE_URL runs migrations, LISTEN and job locks.
  # Event tools: `docker compose exec app /app/infra/production/entrypoint.sh dlq list`.
  app:
    <<: *app
    command: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
    # A self-hosted model (Ollama, LM Studio) on the host machine: http://host.docker.internal:11434 in Admin › AI connections.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # AI vendor keys and routing (GEMINI_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, AI_*) are read from .env; admins
    # normally connect a provider in Admin › AI instead. Without any provider every AI surface stays hidden.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      API_DOCS: ${API_DOCS:-}
      # Features this installation runs without (docs, whiteboards, calendar, time, ai); see .env.example.
      DISABLED_FEATURES: ${DISABLED_FEATURES:-}
      RATE_SIGNUP_PER_HOUR: ${RATE_SIGNUP_PER_HOUR:-10}
      RATE_RECOVERY_PER_HOUR: ${RATE_RECOVERY_PER_HOUR:-20}
      # First-run setup token (README §4): SETUP_TOKEN from .env, else generated once into the data volume.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SETUP_TOKEN_FILE: /data/setup-token
      IDENTITY_DATABASE_URL: postgres://workspace_identity:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      PLATFORM_DATABASE_URL: postgres://workspace_platform:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      SEARCH_DATABASE_URL: postgres://workspace_search:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      CHAT_DATABASE_URL: postgres://workspace_chat:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      HOME_DATABASE_URL: postgres://workspace_home:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      # Unified search (schema "search", written by the search module): chat's role may read it, nothing more.
      CHAT_SEARCH_DATABASE_URL: postgres://workspace_chat:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      WORK_DATABASE_URL: postgres://workspace_work:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      EMPLOYEE_DATABASE_URL: postgres://workspace_employee:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      AI_DATABASE_URL: postgres://workspace_ai:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      OWNER_DATABASE_URL: postgres://workspace_owner:${PG_OWNER_PASSWORD:-}@postgres:5432/workspace
      # The web app: its sign-in sessions (schema "web"), the gateway next door, the browser-facing settings.
      WEB_DATABASE_URL: postgres://workspace_web:${PG_APP_PASSWORD:-}@${PG_HOST:-postgres}:${PG_PORT:-5432}/workspace
      SESSION_SECRET: ${SESSION_SECRET:-}
      GATEWAY_URL: http://127.0.0.1:4000
      # Content-Security-Policy origins: object storage, realtime (default: APP_URL), LiveKit.
      # Local storage is served from APP_URL itself ('self'): nothing to add then.
      STORAGE_PUBLIC_ORIGIN: ${STORAGE_PUBLIC_ORIGIN:-${S3_ENDPOINT:-}}
      NEXT_PUBLIC_CHAT_URL: ${CHAT_PUBLIC_URL:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LOGIN_MAX_FAILS_PER_IP: ${LOGIN_MAX_FAILS_PER_IP:-50}
      # env_file passes all of .env; the Postgres superuser password is not the app's to have.
      POSTGRES_PASSWORD: ""
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:4000:4000"
    volumes:
      - data:/data
      - *secrets-volume
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health && wget -q -O /dev/null http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── Reverse proxy: Caddy (automatic HTTPS, WebSocket, files and meetings domains) ────────────────
  # Sites for APP_DOMAIN, API_DOMAIN, FILES_DOMAIN and MEET_DOMAIN (caddy/Caddyfile); Let's Encrypt certificates are
  # obtained and renewed by Caddy (ports 80 and 443 must reach it). TLS=off: plain HTTP behind a load balancer that
  # terminates TLS. Without it (your own proxy on the host): `docker compose up -d --scale caddy=0`, see README §5.
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on: [app]
    entrypoint: ["/etc/caddy/run.sh"]
    environment:
      # localhost (no .env yet) is served over plain HTTP: no certificate can be issued for it.
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      MEET_DOMAIN: ${MEET_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      TLS: ${TLS:-auto}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/run.sh:/etc/caddy/run.sh:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      default:
        # The app reaches S3_ENDPOINT (the files domain) through Caddy on the private network.
        aliases:
          - ${FILES_DOMAIN:-files.invalid}

  # ── Optional: video meetings (--profile meet) ──────────────────────────────────────────────────
  # Browsers connect to LIVEKIT_URL (wss://, through the reverse proxy) and send media straight to
  # this server on TCP 7881 and UDP 50000-50100: open those in the firewall.
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["meet"]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [""]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset}
        room:
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 100
        logging:
          level: info
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  secrets:
  pgdata:
  data:
  s3data:
  caddydata:
  caddyconfig:

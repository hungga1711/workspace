; Production PgBouncer (infra/production/docker-compose.yml). The auth file is written at container start from
; PG_APP_PASSWORD / PG_OWNER_PASSWORD, so no password lives in this file.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Transaction pooling: the modules keep no session state outside a transaction.
pool_mode = transaction
max_client_conn = 500
default_pool_size = 10
reserve_pool_size = 5
server_idle_timeout = 300
ignore_startup_parameters = extra_float_digits

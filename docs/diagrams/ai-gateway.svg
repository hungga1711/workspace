<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-gateway-title ai-gateway-desc" id="ai-gateway-root">
        <title id="ai-gateway-title">AI model gateway: connections, routing, metering</title>
        <desc id="ai-gateway-desc">Architecture of a company AI call: features go through meteredGenerate (configuration and budget checks), the WorkspaceGateway builds an AiGateway from env vendors and the company&#x27;s stored connections (vendor API key or OpenAI-compatible LLM API with a 45 s timeout, a self-hosted model such as Ollama with 120 s, or the AI on a person&#x27;s connected computer, reached through workspace-connect and /api/ai/local, with 110 s), the router falls back on retriable errors down to a local extractive answer, and every call is metered into ai_usage.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ai-gateway-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ai-gateway-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-gateway-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-gateway-root .diagram-container { overflow-x: visible; }</style>

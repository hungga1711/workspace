    <style>
      *,

        padding: 0;

      :root {

        --color-ink: #2d3142;

        --color-accent: #bf4520;
        --font-sans: "Geist", system-ui, sans-serif;

      body {

      }

        width: 100%;
        overflow-x: auto;

        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 1280px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>

          <desc id="containers-data-desc">

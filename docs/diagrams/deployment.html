    <style>
      *,

        margin: 0;
        padding: 0;

      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #bf4520;
        --font-sans: "Geist", system-ui, sans-serif;
        --font-serif: "Instrument Serif", "Noto Serif", serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
      }
      .frame {
        max-width: 1320px;
        width: 100%;
      }
      .diagram-container {
        width: 100%;
        overflow-x: auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: var(--color-ink);
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 1280px;
        display: block;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>
  </head>

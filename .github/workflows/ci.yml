name: ci
# Every push to a branch of this repository is tested and its image built; a push to main also publishes the image as
# :latest. Pull requests are tested when their branch is not already pushed here: forks, and Dependabot's (its branches
# are tested once, as pull requests, not again on push).
# Free-plan friendly: a docs-only change runs nothing, and a newer push to the same branch cancels the older run.
# The checks, the backend suites and four slices of the browser specs run side by side; `test` gathers them (the name
# branch protection requires and the image waits for).
on:
  push:
    branches: ["**", "!dependabot/**"]
    paths-ignore: ["**.md", "docs/**", "website/**", ".github/workflows/website.yml", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "website/**", ".github/workflows/website.yml", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit (the tag is in the comment) and updated by hand.
jobs:
  checks:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S style
      - name: Event catalog in sync with @workspace/contracts
        run: node tooling/scripts/events-catalog.mjs --check
      - name: OpenAPI document in sync with @workspace/contracts
        run: node tooling/scripts/openapi.mjs --check
      - name: Typecheck
        run: pnpm -r typecheck

  backend:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-stack
      - name: Unit + integration tests (real Postgres/S3)
        # On workspace_test; a suite that needs first-run setup empties it first (one workspace per installation).
        run: pnpm -r --workspace-concurrency=1 test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: backend-server-log, path: server.log }

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test-stack
      - name: Browser extension zip (served from Của tôi › AI; built, never committed)
        run: cd frontend/web && pnpm ext:zip
      - name: Next build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: frontend/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/web/src/**', 'frontend/web/next.config.mjs') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Web build (+ performance budget, once)
        # GATEWAY_URL at build: the rewrites that hand /api/mcp, the runner and the connect program to the server are
        # fixed when the app is built (next.config.mjs), and the E2E specs for them go through the app's address.
        run: |
          cd frontend/web && GATEWAY_URL=http://localhost:4100 NEXT_PUBLIC_CHAT_URL=http://localhost:4100 STORAGE_PUBLIC_ORIGIN="http://localhost:8333 http://localhost:4100" LIVEKIT_URL=ws://localhost:7880 pnpm build
          if [ "${{ matrix.shard }}" = 1 ]; then pnpm budget; fi
      - name: Playwright browser cache
        id: browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright browser
        run: |
          cd frontend/web
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Browser E2E, performance and accessibility (slice ${{ matrix.shard }} of 4)
        # Headed on a virtual display: headless Chromium on Linux has no mouse, and every page served with
        # Cross-Origin-Opener-Policy (all of the app's) then matches (hover: none), so hover-only controls such as the
        # message toolbar never appear. Xvfb gives the browser a pointer, like the desktops the specs drive.
        run: |
          (cd frontend/web && TEST_FIXTURES=1 GATEWAY_URL=http://localhost:4100 WEB_DATABASE_URL=postgres://workspace_web:app_pw@localhost:5432/workspace_test pnpm start > web.log 2>&1 &)
          npx --yes wait-on@8.0.3 -t 120000 http://localhost:3000
          cd frontend/web && GATEWAY_URL=http://localhost:4100 MAIL_OUTBOX_DIR=$RUNNER_TEMP/mail xvfb-run -a npx playwright test --headed --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: "e2e-artifacts-${{ matrix.shard }}", path: "frontend/web/test-results\nserver.log\nfrontend/web/web.log" }

  test:
    needs: [checks, backend, e2e]
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo "checks=${{ needs.checks.result }} backend=${{ needs.backend.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.backend.result }}" = success && test "${{ needs.e2e.result }}" = success

  image:
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

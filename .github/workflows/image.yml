name: image
# The production artefact: build the single image, boot the production compose from empty volumes with generated
# secrets, check that the gateway and the web app answer, then (when `publish` is set) push it to GHCR, sign it and
# attach its SBOM to the release. Called by ci.yml on every push and by release.yml for a new version.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build (default: the commit of the caller)"
        type: string
        default: ""
      publish:
        description: Push to ghcr.io; otherwise build and test only
        type: boolean
        default: false
      latest:
        description: Also move the :latest tag
        type: boolean
        default: false
      version:
        description: Release version (x.y.z) to tag the image with and attach the SBOM to
        type: string
        default: ""

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: workspace:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the production compose
        working-directory: infra/production
        # What an operator runs: install.sh generates .env and its secrets, starts the default set (postgres, app,
        # caddy) over plain HTTP on localhost, waits for health and prints the setup token; then a round trip through
        # Caddy to the web app, the gateway and local-disk storage's route.
        run: |
          WORKSPACE_IMAGE=workspace:local ./install.sh --non-interactive --app-domain localhost --files-domain "" --email ""
          curl -fsS -o /dev/null -w "web /setup %{http_code}\n" http://localhost/setup
          curl -fsS http://127.0.0.1:4000/api/setup
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/storage/forged.token)" = 403
          docker compose ps
      - name: Compose logs
        if: failure()
        working-directory: infra/production
        run: docker compose logs --tail=100
      - name: Stop
        if: always()
        working-directory: infra/production
        run: docker compose down -v --remove-orphans

      - name: Sign in to GHCR
        if: inputs.publish
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the image (:<sha>, :latest, :<version>)
        id: publish
        if: inputs.publish
        env:
          LATEST: ${{ inputs.latest }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/workspace"
          sha=$(git rev-parse --short=12 HEAD)
          docker tag workspace:local "$image:$sha" && docker push "$image:$sha"
          if [ "$LATEST" = true ]; then docker tag workspace:local "$image:latest" && docker push "$image:latest"; fi
          if [ -n "$VERSION" ]; then docker tag workspace:local "$image:$VERSION" && docker push "$image:$VERSION"; fi
          # Every tag points at the same manifest; sign and attest it once, by digest.
          # The local build's own name can be listed first; take the digest under the registry's name.
          ref=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$sha" | grep -m1 "^$image@")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.publish
      - name: Image SBOM (SPDX)
        if: inputs.publish
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.publish.outputs.ref }}
          format: spdx-json
          output-file: workspace-image.spdx.json
          upload-release-assets: false
      - name: Sign the image and attest its SBOM (keyless; verify with cosign verify, see SECURITY.md)
        if: inputs.publish
        run: |
          cosign sign --yes "${{ steps.publish.outputs.ref }}"
          cosign attest --yes --type spdxjson --predicate workspace-image.spdx.json "${{ steps.publish.outputs.ref }}"
      - name: Attach the image SBOM to the release
        if: inputs.publish && inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          cp workspace-image.spdx.json "workspace-$TAG-image.spdx.json"
          gh release upload "$TAG" "workspace-$TAG-image.spdx.json" --clobber --repo "${{ github.repository }}"

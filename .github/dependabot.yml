# Grouped, and npm monthly, so updates arrive as a few pull requests instead of dozens.
version: 2
updates:
  # Majors (Tiptap 2 → 3, Express 4 → 5) need code changes and a reviewed migration, not a bot pull request each:
  # they are done by hand, so only minor and patch updates arrive, as one grouped pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.7+ re-sorts the Tailwind classes in some 350 files: a one-off reformat to do on purpose, not in a bump.
      - dependency-name: prettier-plugin-tailwindcss
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The website is its own pnpm project with its own lockfile.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, website]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, infra]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Postgres, SeaweedFS, Caddy, LiveKit and PgBouncer pinned in the compose files; the templates and the demo pin the
  # same images, so they move in the same grouped pull request.
  - package-ecosystem: docker-compose
    directories: [/infra/production, /infra/local, /infra/demo, /infra/templates, /infra/templates/coolify, /infra/templates/casaos]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, infra]
    # A major version (Postgres 16 → 18, SeaweedFS 3 → 4) changes the data on disk or the config: it needs a migration
    # plan and upgrade notes, never a routine bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
